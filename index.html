<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title>Hello from Electron renderer!</title>
  </head>
  <body>
    <div id="connectionMessage" class="versionText connection-text invisible-el">Connection Unavailable</div>
    <div id="messageContainers" class="versionCon">
      <div id="updateVersionMessage" class="versionText">Update Available</div>
      <div  class="versionText versionText2">
        <span id="versionMessageLabel">V. available: </span><span id="versionMessage"></span>
      </div>
    </div>
    <h1>Steam Runtime Manager</h1>
    <div id="divBody" class="main-body">
      <div id="mainContainer" class="main-side">

     
        <div id="mainWin">

        </div>
        <progress id="fileProgressBar" value="0" max="100" class="dlBar"></progress>
      </div>
      <div id="fileSelectedContent" class="main-side">
        <div>
          <span id="fileSelectedMessage" class="psuedo-label">Runtime Selected:</span>
          <select id="cboMajoSRT">
            <option value="1">Option</option>
          </select>
        </div>
        <span id="fileLoadedMessage" class="psuedo-label">File Loaded:</span>
        <span id="fileSelected" class="versionText2"></span>
        <span id="filePath" class="versionText2"></span>
        <div id="fileVersionDiv" class="versionText2 invisible-el">
          <span id="fileVersionLabel">Runtime Version: </span><span id="fileVersion" ></span>
          <button id="openRunTimeFileBtn" class="versionText2">Open Runtime File Dir</button>
        </div>
      </div>
      
    </div>
    <div id="statusMessage"></div>

    <button id="exitBtn" class="versionText2 exit-button">Exit</button>

    <div id="loaderDiv" class="loader loader-box invisible-el"></div>

    <div id="specialModal" class="modal modal-close">
      <!-- Modal content -->
      <div class="modal-content">
        <span id="modal-banner" class="modalBanner">
          <span id="modal-title" class="modalBanner-title">Message</span><span id="modal-close" class="close">&times;</span>
        </span>
        <p id="specialModalText" class="modal-content-text"></p>
        <button id="closeModalBtn" class="versionText2 modal-close-button">Okay</button>
      </div>
    </div>
  </body>
      <!-- 1. Load local jQuery directly into the browser context -->
  <script src="./node_modules/jquery/dist/jquery.min.js"></script>
  <script src="scripts/startMain.js"></script>
  <link rel="stylesheet" type="text/css" href="scripts/start.css">
</html>
