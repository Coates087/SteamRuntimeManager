<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <title id="title"></title>
  </head>
  <body>
    <div id="connectionMessage" class="versionText connection-text invisible-el"></div>
    <div id="messageContainers" class="versionCon">
      <div id="updateVersionMessage" class="versionText"></div>
      <div class="versionText versionText2">
        <span id="versionMessageLabel"></span><span id="versionMessage"></span>
      </div>
    </div>
    <h1 id="title2"></h1>
    <div id="divBody" class="main-body">
      <div id="mainContainer" class="main-side">

     
        <div id="mainWin">
          <p id="welcome"></p>
          <p id="welcomeDetails"></p>
          <div class="vert-spacer">
            <button id="checkBtn"></button>
            <button id="downloadBtn"></button>
          </div>
          <div class="vert-spacer">
            <button id="loadRunTimeFileBtn"></button>
            <button id="installRunTimeFileBtn"></button>
          </div>
        </div>
        <progress id="fileProgressBar" value="0" max="100" class="dlBar"></progress>
      </div>
      <div id="fileSelectedContent" class="main-side">
        <div>
          <span id="fileSelectedMessage" class="psuedo-label"></span>
          <select id="cboMajoSRT">
            <option value="1">Option</option>
          </select>
        </div>
        <span id="fileLoadedMessage" class="psuedo-label"></span>
        <span id="fileSelected" class="versionText2"></span>
        <span id="filePath" class="versionText2"></span>
        <div id="fileVersionDiv" class="versionText2 invisible-el">
          <span id="fileVersionLabel"></span><span id="fileVersion" ></span>
          <button id="openRunTimeFileBtn" class="versionText2"></button>
        </div>
      </div>
      
    </div>
    <div id="statusMessage"></div>

    <button id="exitBtn" class="versionText2 exit-button"></button>

    <div id="loaderDiv" class="loader loader-box invisible-el"></div>

    <div id="specialModal" class="modal modal-close">
      <!-- Modal content -->
      <div class="modal-content">
        <span id="modal-banner" class="modalBanner">
          <span id="modal-title" class="modalBanner-title"></span><span id="modal-close" class="close">&times;</span>
        </span>
        <p id="specialModalText" class="modal-content-text"></p>
        <button id="closeModalBtn" class="versionText2 modal-close-button"></button>
      </div>
    </div>
  </body>
      <!-- 1. Load local jQuery directly into the browser context -->
  <script src="./node_modules/jquery/dist/jquery.min.js"></script>
  <script src="scripts/startMain.js"></script>
  <link rel="stylesheet" type="text/css" href="scripts/start.css">
</html>
